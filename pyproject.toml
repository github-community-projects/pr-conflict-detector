[project]
name = "pr-conflict-detector"
version = "1.0.0"
description = "Detect pull request conflicts and notify"
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.6.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "flake8==7.5.0",
    "mypy==2.4.1",
    "pylint==4.1.3",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "types-requests==2.33.0.20261006",
]
